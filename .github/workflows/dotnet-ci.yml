name: .NET CI

on:
  push:
    branches: [ master, feature/*, hotfix/*, chore/* ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore ./GnuConvert.sln

      - name: Build (Release)
        run: dotnet build ./GnuConvert.sln --configuration Release --no-restore

      - name: Test (Release)
        run: dotnet test ./GnuConvert.sln --configuration Release --no-build
